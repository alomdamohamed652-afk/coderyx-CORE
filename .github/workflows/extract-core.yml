name: Extract CORE
on:
  push:
    branches: [main]
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive
        run: |
          mkdir -p .coderyx_extract
          unzip -o "package-lock (1).zip" -d .coderyx_extract
      - name: Copy extracted project
        run: |
          shopt -s dotglob
          cp -R .coderyx_extract/* .
          rm -rf .coderyx_extract
          rm -f "package-lock (1).zip"
          rm -f ".github/workflows/extract-core.yml"
      - name: Commit extracted project
        run: |
          git config user.name "coderyx-extractor"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract CORE project from archive" || exit 0
          git push
